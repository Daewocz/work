function findRange(){const num=parseInt(document.getElementById('cislo').value);let f=null;
for(let r of data){let a=r.roz.split('-').map(Number);if(num>=a[0]&&num<=a[1]){f=r;break;}}
if(!f){document.getElementById('vysl').innerHTML='<div class="result-card"><p style="color:#c00;font-size:20px"><strong>Číslo nebylo nalezeno.</strong></p></div>';return;}
let o=singleResult(f);document.getElementById('vysl').innerHTML=o;}
function findText(){const q=document.getElementById('text_search').value.trim().toLowerCase();if(q.length<2)return;
let m=data.filter(r=>r.lok.toLowerCase().includes(q)||r.adr.toLowerCase().includes(q)||r.zkrat.toLowerCase().includes(q));
if(m.length===0){document.getElementById('vysl').innerHTML='<div class="result-card"><p style="color:#c00;font-size:20px"><strong>Nenalezen žádný záznam.</strong></p></div>';return;}
const hl=t=>t.replace(new RegExp(q,'gi'),m=>`<span class='highlight'>${m}</span>`);
let out='';
for(let r of m){out+=`<div class='result-multi'><h3>${hl(r.lok)}</h3><table>
<tr><th>Rozsah</th><td>${r.roz}</td></tr>
<tr><th>AVIS</th><td>${r.avis}</td></tr>
<tr><th>Zkratka</th><td>${hl(r.zkrat)}</td></tr>
<tr><th>BO</th><td>${r.bo}</td></tr>
<tr><th>Adresa</th><td>${hl(r.adr)}</td></tr>
</table></div>`;}
document.getElementById('vysl').innerHTML=out;}
function singleResult(r){return `<div class='result-card'><h2>Výsledek</h2><table>
<tr><th>Lokalita</th><td>${r.lok}</td></tr>
<tr><th>Rozsah</th><td>${r.roz}</td></tr>
<tr><th>AVIS</th><td>${r.avis}</td></tr>
<tr><th>Zkratka</th><td>${r.zkrat}</td></tr>
<tr><th>BO</th><td>${r.bo}</td></tr>
<tr><th>Adresa</th><td>${r.adr}</td></tr>
</table></div>`;}
